version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
